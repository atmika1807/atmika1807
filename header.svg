<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Atmika Manoj Parey, data and AI engineer">
<style>
text{font-family:Georgia,'Times New Roman',serif;font-style:italic}
.n{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-style:normal;font-weight:700;letter-spacing:-1px}
.s{font-family:'Courier New',monospace;font-style:normal;letter-spacing:2px}
.bg{animation:sh 8s ease-in-out infinite alternate}@keyframes sh{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.dot{animation:p 1.6s ease-in-out infinite}@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.l0{opacity:0;animation:k0 12.8s infinite}@keyframes k0{0%,0.00%{opacity:0;transform:translateY(10px)}1.50%,22.00%{opacity:1;transform:translateY(0)}24.50%,100%{opacity:0;transform:translateY(-10px)}}.l1{opacity:0;animation:k1 12.8s infinite}@keyframes k1{0%,25.00%{opacity:0;transform:translateY(10px)}26.50%,47.00%{opacity:1;transform:translateY(0)}49.50%,100%{opacity:0;transform:translateY(-10px)}}.l2{opacity:0;animation:k2 12.8s infinite}@keyframes k2{0%,50.00%{opacity:0;transform:translateY(10px)}51.50%,72.00%{opacity:1;transform:translateY(0)}74.50%,100%{opacity:0;transform:translateY(-10px)}}.l3{opacity:0;animation:k3 12.8s infinite}@keyframes k3{0%,75.00%{opacity:0;transform:translateY(10px)}76.50%,97.00%{opacity:1;transform:translateY(0)}99.50%,100%{opacity:0;transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.l0{opacity:1!important}}
</style>
<rect width="900" height="260" rx="22" fill="#f5f3ef"/>
<g class="bg" opacity=".55"><circle cx="760" cy="60" r="110" fill="#e1e6ea"/><circle cx="690" cy="200" r="70" fill="#d3dbe1"/></g>
<circle class="dot" cx="66" cy="52" r="5" fill="#2f9e6b"/>
<text class="s" x="82" y="57" font-size="13" fill="#5a6772">OPEN TO WORK · IMMEDIATE JOINER · MUMBAI</text>
<text class="n" x="58" y="132" font-size="52" fill="#0c1116" style="font-style:normal">Atmika Manoj Parey</text>
<text class="l0" x="60" y="196" font-size="34" fill="#3b4752">Data &amp; AI engineer</text><text class="l1" x="60" y="196" font-size="34" fill="#3b4752">Production RAG systems</text><text class="l2" x="60" y="196" font-size="34" fill="#3b4752">Agentic workflows with LangGraph</text><text class="l3" x="60" y="196" font-size="34" fill="#3b4752">Streaming pipelines in Python</text>
<rect class="cur" x="60" y="214" width="3" height="0" fill="#0c1116"/>
</svg>